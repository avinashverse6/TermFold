name: probe
on:
  push:
    branches: [arena/b885914c-termfold]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Probe
        run: |
          R=/tmp/report.txt
          : > $R
          log() { echo "$@" >> $R; }

          log "=== proot pool listing"
          for u in \
            https://packages.termux.dev/apt/termux-main/pool/main/p/proot/ \
            https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/ \
            https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/ ; do
            code=$(curl -sSL -o /tmp/dir.html -w '%{http_code}' "$u")
            log "STATUS $code $u"
            [ "$code" = "200" ] && grep -oE 'href="[^"]+"' /tmp/dir.html | sed 's/href=//' | tr -d '"' >> $R
          done

          log "=== old repos for 32-bit"
          for repo in termux-main-21 termux-main; do
            for d in stable; do
              u="https://packages.termux.dev/apt/$repo/dists/$d/main/binary-arm/Packages.xz"
              code=$(curl -sSL -o /tmp/P.xz -w '%{http_code}' "$u")
              log "STATUS $code $u"
              if [ "$code" = "200" ]; then
                xz -dc /tmp/P.xz | grep -A4 -E '^Package: (proot|libtalloc|libandroid-shmem|nodejs)$' >> $R
              fi
            done
          done
          log "=== arch list of termux-main dists"
          curl -sSL "https://packages.termux.dev/apt/termux-main/dists/stable/" | grep -oE 'binary-[a-z0-9]+' | sort -u >> $R

          log "=== qemu"
          sudo apt-get update -qq >> $R 2>&1
          sudo apt-get install -y -qq qemu-user >> $R 2>&1
          ls -l /usr/bin/qemu-arm* >> $R 2>&1 || log "no qemu-arm"
          which qemu-arm-static qemu-arm >> $R 2>&1

          log "=== chroot test (armhf under qemu)"
          mkdir -p /tmp/rf
          tar xzf /tmp/rootfs-does-not-exist 2>/dev/null
          URL="https://raw.githubusercontent.com/debuerreotype/docker-debian-artifacts/7978fc031d5b52b4496cff0bafb95b9bc828c79a/trixie/slim/oci/blobs/rootfs.tar.gz"
          curl -fsSL -o /tmp/rootfs.tar.gz "$URL" && sha256sum /tmp/rootfs.tar.gz >> $R
          tar xzf /tmp/rootfs.tar.gz -C /tmp/rf
          Q=$(command -v qemu-arm-static || command -v qemu-arm)
          sudo cp "$Q" /tmp/rf/usr/bin/qemu-arm-static
          sudo cp /etc/resolv.conf /tmp/rf/etc/resolv.conf
          sudo mkdir -p /tmp/rf/proc && sudo mount -t proc proc /tmp/rf/proc
          sudo chroot /tmp/rf /usr/bin/qemu-arm-static /bin/bash -c '
            export DEBIAN_FRONTEND=noninteractive
            uname -m; dpkg --print-architecture
            apt-get update 2>&1 | tail -2
            apt-get install -y --no-install-recommends ca-certificates python3 git curl nodejs npm 2>&1 | tail -4
            python3 --version; git --version; node --version; npm --version
            apt-cache policy nodejs | head -4
            ldconfig -p | grep -c .
            ln /bin/true /tmp/hl && echo "hardlink ok" && rm /tmp/hl
          ' >> $R 2>&1
          log "chroot exit=$?"

          log "=== node armv7l sha"
          curl -sSL https://nodejs.org/dist/v22.23.3/SHASUMS256.txt | grep armv7l >> $R
          log "=== done"
          cat $R

      - name: Publish report to the branch
        if: always()
        run: |
          cp /tmp/report.txt probe-report.txt 2>/dev/null || echo "no report" > probe-report.txt
          git config user.name arena-agent
          git config user.email agent@arena.ai
          git add -f probe-report.txt
          git commit -m "probe: report" || true
          git push || true
