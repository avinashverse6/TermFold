name: Android

# Builds one APK per architecture, plus the universal APK the in-app updater hands out, checks that
# every native library inside each one is really built for that ABI, and runs Node.js and the agent
# CLIs inside the 32-bit ARM guest under qemu. The APKs and the reports are uploaded as workflow
# artifacts, so a run leaves downloadable files behind instead of a log to read.

on:
  # Every branch: this repository's work happens on short-lived branches, and a build that only
  # runs on main is a build nobody sees until it is too late. Tag pushes run it too, and the
  # release job below is the only part that needs the tag.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept the Android SDK licences
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          [ -x "$SDKM" ] && yes | "$SDKM" --licenses > /dev/null 2>&1 || true
      # The tar tests read the image the app ships, so one ABI has to be staged first.
      - name: Stage PRoot and the Debian image (x86_64)
        run: python3 tools/fetch-shell-runtime.py --abi x86_64
      - name: Stage the CA bundle
        run: python3 tools/fetch-ca-bundle.py
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee gradle-test.log
      - name: Report the test results
        if: always()
        run: |
          python3 -c "import glob,xml.etree.ElementTree as E; r=[E.parse(p).getroot() for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml')]; print('unit tests:', sum(int(x.get('tests',0)) for x in r), 'run,', sum(int(x.get('failures',0))+int(x.get('errors',0)) for x in r), 'failed,', sum(int(x.get('skipped',0)) for x in r), 'skipped')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - name: Explain a failed build
        if: failure()
        run: |
          for log in gradle-test.log build.log; do
            [ -f "$log" ] || continue
            tail -n 60 "$log" | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)"
            done
          done
          exit 0
      - name: Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintDebug 2>&1 | tee -a gradle-test.log

  apk:
    name: APK ${{ matrix.abi }}
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept the Android SDK licences
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          [ -x "$SDKM" ] && yes | "$SDKM" --licenses > /dev/null 2>&1 || true
      # Verifies the committed PRoot, loader, talloc and shmem against their pinned SHA-256 and
      # stages this ABI's Debian image. No architecture is ever borrowed from another one.
      - name: Stage the runtime
        run: python3 tools/fetch-shell-runtime.py --abi ${{ matrix.abi }}
      - name: Stage the CA bundle
        run: python3 tools/fetch-ca-bundle.py
      - name: Build debug and release for ${{ matrix.abi }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease \
            -Ptermfold.abis=${{ matrix.abi }} 2>&1 | tee build.log
      - name: Explain a failed build
        if: failure()
        run: |
          for log in gradle-test.log build.log; do
            [ -f "$log" ] || continue
            tail -n 60 "$log" | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)"
            done
          done
          exit 0
      - name: Check the APK's native libraries
        run: |
          for f in app/build/outputs/apk/*/*.apk; do
            python3 tools/check-apk-abi.py "$f" --require ${{ matrix.abi }}
          done
      - name: Collect the APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk   "out/TermFold-${{ matrix.abi }}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "out/TermFold-${{ matrix.abi }}-release.apk"
          sha256sum out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TermFold-${{ matrix.abi }}
          path: out/*.apk

  universal:
    name: Universal APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept the Android SDK licences
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          [ -x "$SDKM" ] && yes | "$SDKM" --licenses > /dev/null 2>&1 || true
      - name: Stage the runtime and the Debian images
        run: |
          python3 tools/fetch-shell-runtime.py
          python3 tools/fetch-ca-bundle.py
      - name: Build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log
      - name: Explain a failed build
        if: failure()
        run: |
          for log in gradle-test.log build.log; do
            [ -f "$log" ] || continue
            tail -n 60 "$log" | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)"
            done
          done
          exit 0
      - name: Check the APK's native libraries
        run: |
          for f in app/build/outputs/apk/*/*.apk; do
            python3 tools/check-apk-abi.py "$f"
          done
      # The 64-bit binaries must be exactly the pinned bytes, not merely "a 64-bit ELF": this
      # catches the one mistake that would be invisible otherwise — a rebuild quietly replacing
      # them with something else.
      - name: The APK carries the pinned 64-bit binaries
        run: |
          set -e
          for abi in arm64-v8a x86_64; do
            mkdir -p "/tmp/apk/$abi"
            unzip -q -o app/build/outputs/apk/release/*.apk "lib/$abi/*" -d /tmp/apk
            for so in app/src/main/jniLibs/$abi/*.so; do
              name=$(basename "$so")
              inside=$(sha256sum "/tmp/apk/lib/$abi/$name" | cut -d' ' -f1)
              committed=$(sha256sum "$so" | cut -d' ' -f1)
              echo "$abi/$name $inside"
              [ "$inside" = "$committed" ] || { echo "::error::$abi/$name differs from the committed binary"; exit 1; }
            done
          done
      - name: Collect the APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/TermFold-debug.apk
          cp app/build/outputs/apk/release/*.apk out/TermFold-release.apk
          sha256sum out/*.apk
      # The names a person looks for, and the ones the README quotes.
      - name: Upload TermFold-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: TermFold-debug.apk
          path: out/TermFold-debug.apk
      - name: Upload TermFold-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: TermFold-release.apk
          path: out/TermFold-release.apk

  # 32-bit ARM cannot be tested on an arm64 runner or a normal x86_64 one, so the armhf image the
  # APK ships is booted with qemu-arm and the things a user does in it are done for real: install
  # packages, run Python and git, run the pinned Node, install a JavaScript agent, and watch a
  # native agent fail with a message instead of a signal.
  guest:
    name: armhf guest (qemu-arm)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stage the armhf image
        run: python3 tools/fetch-shell-runtime.py --abi armeabi-v7a
      # The staged binaries are committed and pinned by STAGE_SHA256, so a normal build never
      # touches the network for them. This records the digests of the Termux .debs they come from,
      # which is what DEB_SHA256 is for, so the provenance stays checkable end to end.
      - name: Record the Termux package digests
        continue-on-error: true
        run: |
          python3 tools/fetch-shell-runtime.py --record-checksums armeabi-v7a \
            | tee deb-digests.txt
      - name: Exercise the 32-bit guest
        run: |
          set -u
          R=guest-report.txt
          : > "$R"
          fail=0
          say() { echo "$*" | tee -a "$R"; }
          check() { # check <description> <needle> <haystack>
            if printf '%s' "$3" | grep -q -- "$2"; then say "PASS  $1"; else say "FAIL  $1 (wanted $2)"; fail=1; fi
          }
          note() { say "NOTE  $*"; }

          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user dosfstools > /dev/null 2>&1
          Q=$(command -v qemu-arm-static || command -v qemu-arm)
          say "qemu: $Q"
          sudo mkdir -p /tmp/rf
          sudo tar xzf app/src/main/assets/debian-armeabi-v7a.bin -C /tmp/rf
          sudo cp "$Q" /tmp/rf/usr/bin/qemu-arm-static
          sudo cp /etc/resolv.conf /tmp/rf/etc/resolv.conf
          sudo mkdir -p /tmp/rf/proc /tmp/rf/sys /tmp/rf/dev /tmp/rf/mnt/vfat /tmp/rf/opt/termfold
          sudo mount -t proc proc /tmp/rf/proc
          sudo mount -t sysfs sys /tmp/rf/sys
          g() { sudo chroot /tmp/rf /usr/bin/qemu-arm-static /bin/bash -c "$1"; }

          say "== identity"
          id_out=$(g 'uname -m; dpkg --print-architecture; ldd --version | head -1' 2>&1)
          say "$id_out"
          check "guest is armv7l" armv7l "$id_out"
          check "guest is Debian armhf" armhf "$id_out"

          # --- the compatibility shim the APK ships, preloaded into every guest process ----------
          say "== compat shim (libtermfold-compat.so) loads"
          sudo cp app/src/main/assets/compat-shim-armeabi-v7a.so /tmp/rf/opt/termfold/libtermfold-compat.so
          echo /opt/termfold/libtermfold-compat.so | sudo tee /tmp/rf/etc/ld.so.preload > /dev/null
          shim=$(g 'dpkg-deb --help >/dev/null 2>&1 && echo SHIM_LOADS; python3 --version 2>&1 | head -1' 2>&1)
          say "$shim"
          check "shim is accepted by ld.so" SHIM_LOADS "$shim"

          # A filesystem that cannot hold hard links makes the kernel refuse link(2) the way
          # Android's SELinux policy does, so the copy fallback is exercised rather than assumed.
          say "== hard link refused by the filesystem becomes a copy"
          dd if=/dev/zero of=/tmp/vfat.img bs=1M count=32 status=none
          mkfs.vfat /tmp/vfat.img > /dev/null
          sudo mount -o loop,uid=0,gid=0 /tmp/vfat.img /tmp/rf/mnt/vfat
          echo hello-from-armhf > /tmp/link-src.txt
          sudo cp /tmp/link-src.txt /tmp/rf/mnt/vfat/src.txt
          link=$(g 'cd /mnt/vfat && ln src.txt dst.txt; echo ln=$?; cmp src.txt dst.txt && echo COPY_OK; stat -c "src nlink=%h" src.txt' 2>&1)
          say "$link"
          check "link fell back to a copy" COPY_OK "$link"
          check "the copy is not a hard link" "src nlink=1" "$link"
          sudo umount /tmp/rf/mnt/vfat

          # The shim has done its job; the rest of the run must not depend on it.
          sudo rm -f /tmp/rf/etc/ld.so.preload

          say "== apt install in the 32-bit guest"
          tools=$(g 'export DEBIAN_FRONTEND=noninteractive; apt-get install -y --no-install-recommends python3 git curl ca-certificates xz-utils libatomic1 >/dev/null 2>&1; python3 --version; git --version' 2>&1)
          say "$tools"
          check "python3 runs" "Python 3" "$tools"
          check "git runs" "git version" "$tools"

          # --- Node.js, the reason libatomic1 is installed ---------------------------------------
          say "== Node.js v22.23.3 linux-armv7l"
          node=$(g 'cd /tmp && curl -fsSLO https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-armv7l.tar.xz && sha256sum node-v22.23.3-linux-armv7l.tar.xz && tar xJf node-v22.23.3-linux-armv7l.tar.xz && ./node-v22.23.3-linux-armv7l/bin/node --version && ./node-v22.23.3-linux-armv7l/bin/node -e "console.log(process.arch, process.platform, process.version)" && ./node-v22.23.3-linux-armv7l/bin/npm --version' 2>&1)
          say "$node"
          check "the tarball is the pinned one" 590a2768199bdd0b848648a81cd7f07f88a5ceb27949f0c70d5e6652c3eaca69 "$node"
          check "node starts (libatomic.so.1 present)" "^v22" "$node"
          check "node reports 32-bit ARM" "arm linux" "$node"

          say "== a pure-JavaScript agent on 32-bit ARM (pi)"
          pi=$(g 'cd /tmp && export PATH=/tmp/node-v22.23.3-linux-armv7l/bin:$PATH; timeout 420 npm install -g --no-audit --no-fund @earendil-works/pi-coding-agent >/dev/null 2>&1; timeout 120 pi --version 2>&1 | tail -2' 2>&1)
          say "$pi"
          note "pi on ARMv7: $(printf '%s' "$pi" | tail -1)"

          say "== a native agent must refuse clearly (claude-code)"
          claude=$(g 'cd /tmp && export PATH=/tmp/node-v22.23.3-linux-armv7l/bin:$PATH; timeout 420 npm install -g --no-audit --no-fund @anthropic-ai/claude-code 2>&1 | tail -4; timeout 120 claude --version 2>&1 | tail -1' 2>&1)
          say "$claude"
          note "claude-code on ARMv7: $(printf '%s' "$claude" | tail -1)"

          say "== an armv7 release that does exist (uv)"
          uv=$(g 'curl -sSLI -o /dev/null -w "%{http_code}" https://github.com/astral-sh/uv/releases/latest/download/uv-armv7-unknown-linux-musleabihf.tar.gz' 2>&1)
          say "uv armv7 http: $uv"
          check "uv publishes an armv7 build" 200 "$uv"

          sudo umount /tmp/rf/sys /tmp/rf/proc || true
          say "== result: $([ $fail -eq 0 ] && echo all checks passed || echo failures above)"
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-report
          path: guest-report.txt
          if-no-files-found: warn

  # Only the universal APK is attached to a release. The in-app updater takes the first .apk
  # asset of the release (UpdateManager), so publishing per-ABI APKs beside it could hand an arm64
  # build to a 32-bit device. They stay workflow artifacts until the updater picks by ABI.
  release:
    name: Attach the universal APK
    runs-on: ubuntu-latest
    needs: [apk, universal]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TermFold-release.apk
          path: out
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Built from ${GITHUB_SHA}."
          gh release upload "$tag" out/TermFold-release.apk --clobber
