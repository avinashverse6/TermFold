name: Android

# Builds one APK per architecture, plus the universal APK the in-app updater hands out, and
# checks that every native library inside each one is really built for that ABI.
#
# armeabi-v7a is built by the same steps as the others, but only once the Termux "arm" packages are
# pinned in tools/fetch-shell-runtime.py: the fetch script refuses to stage an unpinned binary, and
# until its digests are recorded no 32-bit APK is produced at all (see docs/ARMHF-SUPPORT.md).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TERMUX_PINS_MISSING_HINT: >-
    python3 tools/fetch-shell-runtime.py --record-checksums armeabi-v7a

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
      # The tar tests read the image the app ships, so one ABI has to be staged first.
      - name: Stage PRoot and the Debian image (x86_64)
        run: python3 tools/fetch-shell-runtime.py --abi x86_64
      - name: Stage the CA bundle
        run: python3 tools/fetch-ca-bundle.py
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

  apk:
    name: APK ${{ matrix.abi }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4

      # The ARMv7 host binaries are fetched from Termux, and the fetch script will not stage
      # anything whose SHA-256 has not been recorded. Until then this job builds the other two
      # ABIs and says so, rather than publishing an unverified 32-bit runtime.
      - name: Are the armeabi-v7a packages pinned?
        id: pins
        if: matrix.abi == 'armeabi-v7a'
        run: |
          if grep -q '"armeabi-v7a/proot": None' tools/fetch-shell-runtime.py; then
            echo "pinned=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No armeabi-v7a APK yet::The Termux arm digests are not pinned. Record them with: $TERMUX_PINS_MISSING_HINT"
          else
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage PRoot and the Debian image
        if: matrix.abi != 'armeabi-v7a' || steps.pins.outputs.pinned == 'true'
        run: python3 tools/fetch-shell-runtime.py --abi ${{ matrix.abi }}

      - name: Stage the CA bundle
        if: matrix.abi != 'armeabi-v7a' || steps.pins.outputs.pinned == 'true'
        run: python3 tools/fetch-ca-bundle.py

      - name: Build debug and release
        if: matrix.abi != 'armeabi-v7a' || steps.pins.outputs.pinned == 'true'
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease \
            -Ptermfold.abis=${{ matrix.abi }}

      - name: Check the APK's native libraries
        if: matrix.abi != 'armeabi-v7a' || steps.pins.outputs.pinned == 'true'
        run: |
          for f in app/build/outputs/apk/*/*.apk; do
            python3 tools/check-apk-abi.py "$f" --require ${{ matrix.abi }}
          done

      - name: Collect the APKs
        if: matrix.abi != 'armeabi-v7a' || steps.pins.outputs.pinned == 'true'
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/debug/*.apk; do cp "$f" "out/TermFold-${{ matrix.abi }}-debug.apk"; done
          for f in app/build/outputs/apk/release/*.apk; do cp "$f" "out/TermFold-${{ matrix.abi }}-release.apk"; done
          ls -l out

      - uses: actions/upload-artifact@v4
        if: matrix.abi != 'armeabi-v7a' || steps.pins.outputs.pinned == 'true'
        with:
          name: TermFold-${{ matrix.abi }}
          path: out/*.apk

  universal:
    name: Universal APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage PRoot and the Debian images
        run: |
          for abi in arm64-v8a x86_64; do
            python3 tools/fetch-shell-runtime.py --abi "$abi"
          done
          # armeabi-v7a is added only when its packages are pinned; the script exits non-zero
          # otherwise, which is the answer we want to hear here, not a build failure.
          if grep -q '"armeabi-v7a/proot": None' tools/fetch-shell-runtime.py; then
            echo "::notice title=Universal APK without armeabi-v7a::The Termux arm digests are not pinned yet; the universal APK carries arm64-v8a and x86_64 only."
          else
            python3 tools/fetch-shell-runtime.py --abi armeabi-v7a
          fi
      - name: Stage the CA bundle
        run: python3 tools/fetch-ca-bundle.py
      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Check the APK's native libraries
        run: |
          for f in app/build/outputs/apk/*/*.apk; do
            python3 tools/check-apk-abi.py "$f"
          done
      - name: Collect the APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/TermFold-universal-debug.apk
          cp app/build/outputs/apk/release/*.apk out/TermFold-universal-release.apk
          sha256sum out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TermFold-universal
          path: out/*.apk

  # Only the universal APK is attached to a release. The in-app updater takes the first .apk
  # asset of the release (UpdateManager), so publishing per-ABI APKs beside it could hand an arm64
  # build to a 32-bit device. They stay workflow artifacts until the updater picks by ABI.
  release:
    name: Attach the universal APK
    runs-on: ubuntu-latest
    needs: [apk, universal]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TermFold-universal
          path: out
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Built from ${GITHUB_SHA}."
          gh release upload "$tag" out/TermFold-universal-release.apk --clobber
